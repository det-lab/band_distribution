name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the nearest git tag --
          # see the matching comment in build.yml.
          fetch-depth: 0
          fetch-tags: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          set -x
          python -m pip install build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    # Only an actual version tag publishes; workflow_dispatch is for a dry
    # -run build (the job above) without pushing anything to PyPI.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) -- no API token stored
      # as a secret. See https://docs.pypi.org/trusted-publishers/.
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
