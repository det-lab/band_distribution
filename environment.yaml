name: band
channels:
  - conda-forge
  - defaults
dependencies:
  # python 3.12: new enough for equibin (requires >=3.11), old enough
  # for numpy<2 (see below), and the version the chi-square validation
  # of the PDFs was run with
  - python=3.12
  # No compiler here: gfortran/flang come from the Dockerfile's base image
  # (apt, or gmao/llvm-flang), and ifx is added on top of this env by
  # Dockerfile_intel/_tau_intel specifically (`mamba install -n band
  # -c https://software.repos.intel.com/python/conda ifx_linux-64`) -- NOT
  # unconditionally here, so the llvm and jupyter images never pull Intel's
  # ifx binaries at all (they used to, via this file, even though they
  # never used it: environment.yaml is shared by every container).
  - mpi4py
  - fpm
  - ford
  - graphviz
  - lmfit
  - ipykernel
  - matplotlib
  # numpy<2 because lintsampler 1.0.0 (below) pins numpy<2.0: with a
  # numpy 2.x conda package installed, the pip step tries to build
  # numpy 1.x from source and fails.  Drop the pin when a lintsampler
  # release supports numpy 2.
  - numpy<2
  - scipy
  - pandas
  # h5py: reading/writing the precomputed normalization tables (python/normgrid.py)
  - h5py
  # pooch: fetching the published tables by name (python/normtables.py)
  - pooch
  - pip
  - pip:
    - equibin
    - lintsampler
